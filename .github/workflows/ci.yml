# CI for the Naver Blog Automation handoff repository.
# - linux: unit/integration tests, demo run, release build + manifest check
# - windows: REAL Windows runner executes the user-facing BAT files (install/doctor/smoke/run_once/run_snapshot_demo)
#   inside a path that contains spaces and Korean characters.
# No secrets are used. No network price collection, login or publication happens here.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workspace/Naver_Blog_Automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/dependencies.lock
          .venv/bin/python -m pip check
      - name: Doctor
        run: .venv/bin/python tools/doctor.py
      - name: Tests (workspace + snapshot add-on)
        run: .venv/bin/python tools/qa_runner.py
      - name: Daily run and snapshot demo
        run: |
          .venv/bin/python tools/run_once.py
          .venv/bin/python tools/run_once.py --snapshot-demo
      - name: Build install ZIP
        run: .venv/bin/python tools/build_release.py --out "$RUNNER_TEMP/dist" --label ci-${{ github.run_number }}
      - name: Handoff manifest check
        working-directory: .
        run: python tools/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs-and-install-zip
          path: |
            workspace/Naver_Blog_Automation/09_LOGS/
            ${{ runner.temp }}/dist/
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Copy workspace to a path with spaces and Korean
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP '작업 폴더\Naver Blog'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Recurse -Force 'workspace\Naver_Blog_Automation\*' $target
          "WS=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: install.bat (real BAT + bootstrap.ps1)
        shell: cmd
        run: |
          cd /d "%WS%"
          call install.bat < NUL
      - name: doctor.bat
        shell: cmd
        run: |
          cd /d "%WS%"
          call doctor.bat < NUL
      - name: smoke.bat (all tests on Windows)
        shell: cmd
        run: |
          cd /d "%WS%"
          call smoke.bat < NUL
      - name: run_once.bat (empty inbox must exit 0)
        shell: cmd
        run: |
          cd /d "%WS%"
          call run_once.bat < NUL
      - name: run_snapshot_demo.bat
        shell: cmd
        run: |
          cd /d "%WS%"
          call run_snapshot_demo.bat < NUL
      - name: Reinstall keeps user settings
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:WS
          $before = (Get-FileHash '01_CONFIG\settings.local.json').Hash
          cmd /c "install.bat < NUL"
          if ($LASTEXITCODE -ne 0) { throw "reinstall failed" }
          $after = (Get-FileHash '01_CONFIG\settings.local.json').Hash
          if ($before -ne $after) { throw "settings.local.json changed on reinstall" }
          Write-Host "settings preserved"
      - name: Scheduler script syntax only (no task is registered)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:WS 'tools\schedule.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw "schedule.ps1 parse errors" }
          Write-Host "schedule.ps1 parses. Registration is NOT executed in CI."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-logs
          path: ${{ env.WS }}/09_LOGS/
          if-no-files-found: warn
